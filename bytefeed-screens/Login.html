<!DOCTYPE html>

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface flex flex-col min-h-screen items-center justify-center p-4">
<!-- Auth Shell Suppression: Per instructions, TopAppBar and BottomNavBar are suppressed for transactional flows -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo Branding -->
<div class="mb-8 flex items-center justify-center">
<span class="text-primary-container text-4xl material-symbols-outlined mr-2" data-icon="grid_view" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<span class="text-3xl font-black text-on-surface tracking-tighter">ByteFeed</span>
</div>
<!-- Authentication Card -->
<div class="w-full bg-surface-container-lowest p-8 md:p-10 rounded-xl border border-outline-variant/10 shadow-[0px_12px_32px_rgba(0,98,157,0.06)]">
<h1 class="text-2xl font-bold tracking-tight text-on-surface mb-8 text-center">Sign in to ByteFeed</h1>
<form class="space-y-6">
<!-- Username/Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant px-1" for="identity">Email or @username</label>
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all duration-200 outline-none" id="identity" placeholder="e.g. hello@bytefeed.com" type="text"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-sm font-semibold text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-semibold text-primary-container hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all duration-200 outline-none" id="password" placeholder="Enter your password" type="password"/>
</div>
<!-- Action Button -->
<button class="w-full bg-gradient-primary text-on-primary font-bold py-4 rounded-full shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-transform duration-200 mt-4" type="submit">
                    Log In
                </button>
</form>
<!-- Social Login Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="bg-surface-container-lowest px-4 text-outline font-medium">Or continue with</span>
</div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 bg-surface-container-high hover:bg-surface-variant text-on-surface font-semibold py-3 px-4 rounded-full transition-colors duration-200">
<img alt="" class="w-5 h-5" data-alt="Official Google G logo icon with bright multi-color segments on a transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5SKCgGhXTpFpiiLSyKK2EVxexvHne-c9EcmrgeSjqsbwli7wIqIHSeE7COKNanLyzV-N_P1o8IO6SXmiFLRdLCVxOf6y6EdhYm_32jo1hdYBbjXpSdESywe3d1VfNHwPvohgpxfzSAN7aBlHW_Dvf75Z955WB9ef3Op-qIIfdf9i_qF5qS_W_xWVimkp8MF2563XITH5Ur9AjKNyZZ8p9bZwaepOJtpQO49qSxxmNtx4WBzsM1R-1GevA_ZQbiRS9Lpb1FGvtxz9m"/>
<span>Google</span>
</button>
<button class="flex items-center justify-center gap-2 bg-surface-container-high hover:bg-surface-variant text-on-surface font-semibold py-3 px-4 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-xl" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span>Apple</span>
</button>
</div>
</div>
<!-- Footer / Redirect Link -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-sm font-medium">
                Don't have an account? 
                <a class="text-primary-container font-bold ml-1 hover:underline underline-offset-4" href="#">Sign up</a>
</p>
</div>
</main>
<!-- Footer Information -->
<footer class="w-full py-12 mt-auto">
<div class="flex flex-wrap justify-center gap-x-6 gap-y-2 px-8 w-full border-t border-outline-variant/20 pt-8">
<a class="text-[0.75rem] font-['Inter'] leading-tight text-[#3f4851] hover:text-[#1d9bf0] transition-colors cursor-pointer" href="#">About</a>
<a class="text-[0.75rem] font-['Inter'] leading-tight text-[#3f4851] hover:text-[#1d9bf0] transition-colors cursor-pointer" href="#">Help Center</a>
<a class="text-[0.75rem] font-['Inter'] leading-tight text-[#3f4851] hover:text-[#1d9bf0] transition-colors cursor-pointer" href="#">Privacy Policy</a>
<a class="text-[0.75rem] font-['Inter'] leading-tight text-[#3f4851] hover:text-[#1d9bf0] transition-colors cursor-pointer" href="#">Terms of Service</a>
<a class="text-[0.75rem] font-['Inter'] leading-tight text-[#3f4851] hover:text-[#1d9bf0] transition-colors cursor-pointer" href="#">Cookie Policy</a>
</div>
<div class="text-center mt-4">
<p class="text-[0.75rem] font-['Inter'] leading-tight text-[#3f4851]">© 2024 ByteFeed. All rights reserved.</p>
</div>
</footer>
